# nginx que sirve la landing ya compilada, dentro de su contenedor. El nginx de
# afuera (el del repo de infra) es el que termina TLS y decide qué dominio va a
# dónde; este sólo entrega archivos.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite le pone un hash al nombre de cada archivo de /assets: el contenido de
  # una URL nunca cambia, así que se puede cachear para siempre. Cuando sale
  # una versión nueva cambian los nombres y el navegador los pide solos.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El index no se cachea: es el que apunta a los assets nuevos. Si el
  # navegador se queda con uno viejo, pide archivos que ya no existen.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # No hay router: lo que no existe es un 404 de verdad.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;
}
